<div
  class="product-label-node"
  [class.node-hidden]="!isVisible"
  [class.node-active]="status === 'active'"
  [class.node-completed]="status === 'completed'"
  [class.node-visible]="isVisible"
  [class.node-mobile]="isMobile"
  [class.card-order-1]="detail.order === 1"
  [class.card-order-2]="detail.order === 2"
  [class.card-order-3]="detail.order === 3"
  [class.card-order-4]="detail.order === 4"
  [class.side-left]="detail.order === 1 || detail.order === 3"
  [class.side-right]="detail.order === 2 || detail.order === 4"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (click)="onClick()">

  <!-- Visual Anchor Beacon & Radial Ping -->
  <div class="beacon-anchor">
    <div class="beacon-core"></div>
    <div class="beacon-ring"></div>
    <div class="beacon-ping"></div>
  </div>

  <!-- Connecting Leader Line -->
  <div class="leader-line-wrap" [class.leader-to-left]="detail.desktopPosition.x > 50">
    <svg class="leader-line-svg" viewBox="0 0 50 20" fill="none">
      <path
        d="M 0,10 L 44,10"
        stroke="rgba(0, 240, 255, 0.45)"
        stroke-width="1.2"
        stroke-dasharray="3 3" />
      <circle cx="44" cy="10" r="2.5" fill="#00f0ff" />
    </svg>
  </div>

  <!-- Floating Technical Data Card -->
  <div class="label-card glass-panel">
    <div class="card-glow"></div>
    
    <!-- Top Telemetry Header -->
    <div class="label-meta-row">
      <span class="label-tag font-mono">{{ detail.label }}</span>
      <span class="label-status-dot"></span>
    </div>

    <!-- Title & Subtitle -->
    <div class="label-main">
      <h4 class="label-title">{{ detail.title }}</h4>
      <span class="label-subtitle font-mono">{{ detail.subtitle }}</span>
    </div>

    <!-- Micro Description -->
    <p class="label-desc">{{ detail.description }}</p>

    <!-- Bottom Specs Divider & Technical Value -->
    <div class="label-specs font-mono">
      <span class="specs-bullet">›</span>
      <span class="specs-text">{{ detail.specs }}</span>
    </div>

    <!-- Corner HUD Accents -->
    <div class="hud-corner-tl"></div>
    <div class="hud-corner-br"></div>
  </div>

</div>
